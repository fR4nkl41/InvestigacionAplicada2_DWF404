apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-gastos-api
  labels:
    app: control-gastos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-gastos-api
  template:
    metadata:
      labels:
        app: control-gastos-api
    spec:
      containers:
        - name: control-gastos-api
          image: control-gastos-api:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: control-gastos-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
